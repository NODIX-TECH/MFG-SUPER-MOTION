name: Pull Request Security and Scope Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files, binaries, and PR checklist
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const pr = context.payload.pull_request;
            const baseSha = pr.base.sha;
            const headSha = pr.head.sha;

            const diffOut = execSync(`git diff --name-status ${baseSha} ${headSha}`, { encoding: 'utf8' });
            const lines = diffOut.split('\n').map(l => l.trim()).filter(Boolean);

            const binaryRegex = /\.(exe|dll|rar|zip|7z|obj|lib|pdb|so|dylib|bin|sys)$/i;
            const blockedBinaries = [];
            const protectedFiles = [];
            const reviewRequiredPaths = [];

            for (const line of lines) {
              const parts = line.split(/\s+/);
              const status = parts[0];
              const filePath = parts[parts.length - 1];
              if (status !== 'D' && binaryRegex.test(filePath)) {
                blockedBinaries.push(filePath);
              }
              if (filePath === 'LICENSE' || filePath === 'THIRD-PARTY-NOTICES.txt') {
                protectedFiles.push(filePath);
              }
              if (/^(Engine|Infrastructure)\//i.test(filePath)) {
                reviewRequiredPaths.push(filePath);
              }
            }

            const body = pr.body || '';
            const hasChecklist = body.includes('- [x]');
            const errors = [];

            if (blockedBinaries.length > 0) {
              errors.push(`Binary files are forbidden in PRs: ${blockedBinaries.join(', ')}`);
            }
            if (protectedFiles.length > 0) {
              errors.push(`Protected license files cannot be modified: ${protectedFiles.join(', ')}`);
            }
            if (!hasChecklist) {
              errors.push('The mandatory Pull Request checklist (`- [x]`) is not completed.');
            }

            if (reviewRequiredPaths.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['needs-human-review']
              });
            }

            if (errors.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['blocked-by-guard']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: [
                  'This Pull Request was blocked by `pr-guard`:',
                  '',
                  ...errors.map(e => `- ${e}`),
                  '',
                  'Review [AGENTS.md](AGENTS.md) and [SECURITY.md](SECURITY.md) before updating this PR.'
                ].join('\n')
              });
              core.setFailed(errors.join(' | '));
            }
