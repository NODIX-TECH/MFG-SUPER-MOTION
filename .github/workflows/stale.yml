name: Close Stale Issues

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close inactive issues after 14 days
        uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has had no activity for 14 days. It will be closed shortly unless new diagnostic details or logs are provided.'
          close-issue-message: 'Closing this issue due to 14 days of inactivity without response.'
          days-before-stale: 14
          days-before-close: 1
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,confirmed'
          days-before-pr-stale: -1
          days-before-pr-close: -1
